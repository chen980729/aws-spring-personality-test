spring:
  application:
    name: spring-aws-portfolio-backend
  session:
    timeout: 30m

    jdbc:
      initialize-schema: never


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USERNAME:portfolio}
    password: ${DB_PASSWORD:portfolio}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

app:
  assessment:
    clarification:
      ai:
        bedrock:
          enabled: ${BEDROCK_CLARIFICATION_ENABLED:false}
          region: ${AWS_REGION:ap-northeast-1}
          model-id: ${BEDROCK_CLARIFICATION_MODEL_ID:}
          api-call-timeout: 20s
          api-call-attempt-timeout: 18s

management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: false
        same-site: lax
        path: /
