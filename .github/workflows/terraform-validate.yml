name: Terraform validate

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-validate.yml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform/app

      # Temporary lockfile reconciliation: this provider lock was originally
      # created on Windows. Include signed hashes for both developer and CI OS.
      - name: Resolve signed Linux and Windows provider checksums
        working-directory: infra/terraform/app
        run: |
          terraform providers lock -platform=linux_amd64 -platform=windows_amd64
          echo 'BEGIN_RECONCILED_TERRAFORM_LOCK'
          cat .terraform.lock.hcl
          echo 'END_RECONCILED_TERRAFORM_LOCK'

      - name: Initialize providers without remote backend
        working-directory: infra/terraform/app
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: infra/terraform/app
        run: terraform validate -no-color
