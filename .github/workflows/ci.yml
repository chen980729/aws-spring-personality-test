name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Reject local backend URL in production bundle
        run: |
          if grep -R "localhost:8080" dist; then
            echo "Production bundle contains localhost:8080"
            exit 1
          fi

  docker:
    name: Backend Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: |
          docker build \
            --tag spring-aws-portfolio-backend:ci \
            ./backend

      - name: Verify non-root runtime user
        run: |
          test "$(docker image inspect \
            spring-aws-portfolio-backend:ci \
            --format '{{.Config.User}}')" = "spring"

      - name: Verify exposed port
        run: |
          docker image inspect \
            spring-aws-portfolio-backend:ci \
            --format '{{json .Config.ExposedPorts}}' \
            | grep -q '"8080/tcp"'